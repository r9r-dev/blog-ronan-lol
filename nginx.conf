server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # Issue protocol-relative redirects so Pangolin's https isn't downgraded
  # when nginx canonicalises directory URLs. Also avoid trailing-slash
  # redirects entirely by serving $uri/index.html directly via try_files.
  absolute_redirect off;

  # Astro hashed assets — long cache, immutable
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Pagefind search index — short cache; rebuilds with every deploy
  location /pagefind/ {
    expires 1d;
    add_header Cache-Control "public, must-revalidate";
  }

  # Static fonts/images
  location ~* \.(svg|woff2|woff|ttf|jpg|jpeg|png|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
  }

  # Pretty URLs: serve /foo as /foo/index.html or /foo.html, real 404 otherwise.
  # Order matters — putting $uri/index.html before $uri/ avoids the trailing-slash
  # redirect dance for directory matches.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  # 404 page rendered via error_page so the response code is actually 404.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Health check endpoints (/healthz canonical, /health alias for Pangolin)
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/rss+xml
    application/xml
    image/svg+xml
    font/ttf
    font/otf;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "interest-cohort=()" always;
}
