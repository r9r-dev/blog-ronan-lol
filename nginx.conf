server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  # Astro hashed assets — long cache, immutable
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Pagefind search index — short cache; rebuilds with every deploy
  location /pagefind/ {
    expires 1d;
    add_header Cache-Control "public, must-revalidate";
  }

  # Static fonts/images
  location ~* \.(svg|woff2|woff|ttf|jpg|jpeg|png|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
  }

  # Pretty URLs: /foo → /foo/index.html, fallback to 404
  location / {
    try_files $uri $uri/ $uri.html /404.html;
  }

  # 404 page
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Health check endpoint
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/rss+xml
    application/xml
    image/svg+xml
    font/ttf
    font/otf;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "interest-cohort=()" always;
}
